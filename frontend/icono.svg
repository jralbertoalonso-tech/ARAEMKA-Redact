<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ARAEMKA Redact — anonimización local</title>

  <!-- Fondo del icono -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="#1d5d8f"/>

  <!-- Documento con la esquina doblada -->
  <path d="M136 96 h158 l82 82 v238 a26 26 0 0 1 -26 26 H136 a26 26 0 0 1 -26 -26 V122 a26 26 0 0 1 26 -26 z"
        fill="#ffffff"/>
  <path d="M294 96 l82 82 h-60 a22 22 0 0 1 -22 -22 z" fill="#a9c3d8"/>

  <!-- Líneas de texto y barras de redacción (el gesto de anonimizar) -->
  <rect x="150" y="196" width="130" height="18" rx="9" fill="#c3d0dc"/>
  <rect x="150" y="240" width="212" height="30" rx="10" fill="#12324c"/>
  <rect x="150" y="298" width="96" height="18" rx="9" fill="#c3d0dc"/>
  <rect x="262" y="298" width="100" height="18" rx="9" fill="#12324c"/>

  <!-- Nodo local: un centro con dos enlaces que no salen del documento -->
  <path d="M256 372 L196 410" stroke="#f2a03d" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 372 L316 410" stroke="#f2a03d" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="372" r="26" fill="#f2a03d"/>
  <circle cx="192" cy="414" r="16" fill="#f2a03d"/>
  <circle cx="320" cy="414" r="16" fill="#f2a03d"/>
</svg>
