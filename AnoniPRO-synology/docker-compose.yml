# AnoniPRO — despliegue en Synology DS923+ usando la imagen YA CONSTRUIDA
# (anonipro-imagen.tar.gz). No necesita internet ni compilar nada en el NAS.
# Ver INSTRUCCIONES.md, están pensadas para seguirlas paso a paso.

services:
  anonipro:
    image: anonipro:0.10.0        # la imagen importada desde anonipro-imagen.tar.gz
    container_name: anonipro
    restart: unless-stopped
    ports:
      - "8080:8080"               # se accede en http://IP-DEL-NAS:8080
    environment:
      # ── Contraseña de acceso a la web ─────────────────────────────────
      # RECOMENDADA: el NAS puede ser accesible por más personas.
      # Escríbela entre las comillas. Vacía = sin contraseña.
      ANONIPRO_PASSWORD: ""
      # Minutos que un documento permanece en memoria antes de borrarse solo.
      ANONIPRO_TTL_MINUTOS: "30"
      # Tamaño máximo de archivo aceptado (MB).
      ANONIPRO_MAX_MB: "50"
      HOME: "/tmp"
    # Máxima privacidad: sistema de archivos de solo lectura; lo único
    # escribible es /tmp, que vive en RAM. No se monta ningún volumen:
    # los documentos nunca tocan el disco del NAS.
    read_only: true
    tmpfs:
      # Tamaño acotado: el NAS comparte memoria con otros servicios y los
      # documentos se procesan aquí (en RAM). Sin límite, un lote grande podría
      # llenar la memoria del NAS.
      - /tmp:size=1g
    # Límite de memoria del contenedor (el modelo de idioma usa ~1,5 GB).
    mem_limit: 3g
    # Si el proceso se cuelga, el NAS lo reinicia solo en vez de mostrarlo «sano».
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/estado',timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
